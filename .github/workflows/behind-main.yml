name: behind-main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: behind-main-${{ github.event.pull_request.number || 'main' }}

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- behind-main -->';

            const prs = context.eventName === 'pull_request'
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, { owner, repo, base: 'main', state: 'open' });

            for (const pr of prs) {
              const { data: sinceBranch } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${pr.head.sha}...main`,
              });
              const prFiles = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
              const prPaths = new Set(prFiles.map((f) => f.filename));
              const overlap = sinceBranch.files.filter((f) => prPaths.has(f.filename)).length;

              const body = [
                marker,
                `**${sinceBranch.ahead_by}** commits behind \`main\`.`,
                `**${sinceBranch.files.length}** files changed on \`main\` since branching, **${overlap}** also changed in this PR.`,
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
              const existing = comments.find((c) => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            }
