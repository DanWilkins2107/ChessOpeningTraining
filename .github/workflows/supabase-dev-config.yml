name: supabase-dev-config

# Pushes supabase/config.toml (auth settings and email templates) to the
# hosted dev project. `config push` prints the diff before applying it.
on:
  push:
    branches: [main]
    paths:
      - supabase/config.toml
      - supabase/templates/**
      - supabase/emailTemplates/**
      - .github/workflows/supabase-dev-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-dev-config
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The built templates are gitignored; config.toml points at them.
      - run: npm run email:build

      - run: npx supabase link --project-ref "$PROJECT_REF"

      - run: npx supabase config push --project-ref "$PROJECT_REF" --yes
