project_id = "ChessOpeningTraining"

# 54321-54324 are permanently held by another local Supabase stack
# on this machine, so every port is shifted 543xx -> 545xx. Everything the CLI
# can default is omitted; see the reference for what is available:
# https://supabase.com/docs/guides/local-development/cli/config

[api]
port = 54521

[db]
port = 54522
shadow_port = 54520

[studio]
port = 54523

[local_smtp]
port = 54524

[analytics]
port = 54527

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
minimum_password_length = 8
# Mirrored for the live checklist in web/src/elements/passwordRules/passwordRules.ts.
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.email.template.recovery]
subject = "Reset your Chess Opening Training password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Chess Opening Training email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Chess Opening Training verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.magic_link]
subject = "Sign in to Chess Opening Training"
content_path = "./supabase/templates/magic_link.html"

# Sign-up only hides that an email is already registered when neither email nor
# SMS autoconfirms, so SMS confirmations are on even though SMS sign-up is not.
[auth.sms]
enable_confirmations = true
