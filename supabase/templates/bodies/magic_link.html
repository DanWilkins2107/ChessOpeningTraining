<h1 style="margin: 0 0 16px; color: #4f3824; font-size: 20px; font-weight: 700">
  Sign in to Chess Opening Training
</h1>
<p style="margin: 0">Use the button below to sign in to your account.</p>
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="margin: 24px 0"
>
  <tr>
    <td style="border-radius: 999px; background: #2f7a57">
      <a
        href="{{ .ConfirmationURL }}"
        style="
          display: inline-block;
          padding: 12px 28px;
          border-radius: 999px;
          color: #ffffff;
          font-weight: 700;
          text-decoration: none;
        "
        >Sign in</a
      >
    </td>
  </tr>
</table>
<p style="margin: 0 0 16px; color: #6b655f; font-size: 14px">
  If the button doesn't work, paste this link into your browser:<br />
  <a href="{{ .ConfirmationURL }}" style="color: #2f7a57; word-break: break-all"
    >{{ .ConfirmationURL }}</a
  >
</p>
<p style="margin: 0; color: #6b655f; font-size: 14px">
  If you didn't ask to sign in, you can safely ignore this email.
</p>
