<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Chess Opening Training</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Shared layout for every auth email. Colours, radii and font are literals
      copied from web/src/theme.css (emails can't use CSS variables), so update
      both together.

      This is the only layout. Supabase wants one complete file per email and
      has no includes, so npm run email:build pastes each bodies/ fragment over
      the BODY marker below to write the top-level <name>.html files. Edit this
      file and bodies/, never the generated files (email:check catches drift).

      CTA button for fragments to copy:
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0;">
        <tr>
          <td style="border-radius: 999px; background: #2f7a57;">
            <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 12px 28px; border-radius: 999px; color: #ffffff; font-weight: 700; text-decoration: none;">Label</a>
          </td>
        </tr>
      </table>
    -->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f7f9fc;
      color: #4f3824;
      font-family:
        'Plus Jakarta Sans',
        'Segoe UI',
        system-ui,
        -apple-system,
        sans-serif;
      font-size: 16px;
      line-height: 1.5;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #f7f9fc"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 560px"
          >
            <tr>
              <td
                style="
                  padding: 0 8px 16px;
                  color: #4f3824;
                  font-size: 22px;
                  font-weight: 700;
                "
              >
                Chess Opening Training
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 32px;
                  background: #ffffff;
                  border: 1px solid #d9e0ea;
                  border-radius: 10px;
                  color: #4f3824;
                "
              >
                <!-- BODY -->
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 8px 0; color: #6b655f; font-size: 12px">
                You're receiving this email because of activity on your Chess
                Opening Training account.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
